name: Сборка установщика

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить зависимости
        run: npm install

      - name: Скачать yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "resources/yt-dlp.exe"

      - name: Ключи входа Google (из секретов репозитория)
        shell: pwsh
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if ($env:GOOGLE_OAUTH_JSON) { Set-Content -Path src/google-oauth.json -Value $env:GOOGLE_OAUTH_JSON -Encoding utf8NoBOM; Write-Host "google-oauth.json: есть" } else { Write-Host "google-oauth.json: секрет не задан — вход через браузер будет выключен" }

      - name: Собрать установщик и выложить в Releases
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

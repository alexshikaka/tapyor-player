<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тапёр — лента сообщений</title>
<!-- Стили те же, что в приложении: док выглядит один-в-один как вкладка «Заказы» -->
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg0); color: var(--tx); font-family: Onest, sans-serif; }
  .dock { height: 100%; display: flex; flex-direction: column; min-height: 0; }

  .dock-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--ln2); background: var(--bg1); }
  .dock-head b { font: 700 12.5px Onest, sans-serif; letter-spacing: .02em; color: var(--tx); }
  .dock-head .cnt { font: 500 11.5px Onest, sans-serif; color: var(--tx4); margin-left: auto; }
  .dock-head .tg { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .dock-head .tg span { font: 600 11px Onest, sans-serif; color: var(--tx3); }
  .dock-head .tg .sw { width: 26px; height: 14px; border-radius: 7px; background: var(--ln3); position: relative; transition: background .15s; }
  .dock-head .tg .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: .85; transition: transform .15s, background .15s; }
  .dock-head .tg.on .sw { background: var(--ac); }
  .dock-head .tg.on .sw::after { transform: translateX(12px); }

  /* Лента: тот же список, что в приложении, с тем же зазором между сообщениями */
  .dock-feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 12px; }
  .dock-feed::-webkit-scrollbar { width: 8px; }
  .dock-feed::-webkit-scrollbar-thumb { background: var(--ln3); border-radius: 4px; }
  .dock-feed::-webkit-scrollbar-track { background: transparent; }

  /* Карточки сообщений — штатные .rq из приложения, только под ширину дока */
  .dock-feed .rq { padding: 10px 12px; gap: 7px; }
  .dock-feed .rq-h { font-size: 12px; gap: 6px; }
  .dock-feed .rq-h b { font-size: 13px; }
  .dock-feed .rq-sm { height: 28px; padding: 0 11px; font-size: 11.5px; }
  .dock-feed .rq-it { gap: 5px; }

  .dock-empty { color: var(--tx4); font-size: 12px; text-align: center; padding: 18px 8px; }

  /* Плеер внизу */
  .dock-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    border-top: 1px solid var(--ln2); background: var(--bg1); }
  .dock-bar .np { flex: 1; min-width: 0; font-size: 11px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock-bar .np b { color: var(--tx2); font-weight: 600; }
  .dock-bar .time { font: 500 10.5px ui-monospace, monospace; color: var(--tx4); font-variant-numeric: tabular-nums; }
  .db { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 7px;
    background: transparent; color: var(--tx2); cursor: pointer; padding: 0; flex: 0 0 auto; }
  .db:hover { background: var(--hov); color: var(--tx); }
  .db svg { width: 11px; height: 11px; fill: currentColor; }
  .db.play { width: 28px; height: 28px; background: var(--tx); color: var(--bg0); border-radius: 50%; }
  .db.play:hover { background: #fff; }
</style>
</head>
<body>
<div class="dock">
  <div class="dock-head">
    <b>Лента сообщений</b>
    <span class="cnt" id="cnt">—</span>
    <label class="tg" id="exactTg" title="Точные — сразу в очередь">
      <span>Точные</span>
      <i class="sw"></i>
    </label>
  </div>

  <div class="dock-feed" id="feed"><div class="dock-empty">Сообщений пока нет</div></div>

  <div class="dock-bar">
    <button class="db" data-cmd="prev" title="Назад" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14l-10-7z"/></svg>
    </button>
    <button class="db play" id="pp" data-cmd="playpause" title="Пауза / играть" aria-label="Пауза / играть">
      <svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
    </button>
    <button class="db" data-cmd="next" title="Следующий" aria-label="Следующий">
      <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10-7z"/></svg>
    </button>
    <span class="np" id="np">ничего не играет</span>
    <span class="time" id="tm">0:00</span>
  </div>
</div>

<script>
(function(){
  var feedEl = document.getElementById('feed');
  var cntEl = document.getElementById('cnt');
  var npEl = document.getElementById('np');
  var tmEl = document.getElementById('tm');
  var ppEl = document.getElementById('pp');
  var tgEl = document.getElementById('exactTg');
  var stickBottom = true;
  var lastHtml = '';

  function fmt(t){ t = Math.max(0, Math.round(t || 0)); var m = Math.floor(t / 60), s = t % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function applySkin(st){
    if (!st) return;
    // те же классы темы и оболочки, что в приложении
    document.documentElement.className = st.dockClass != null ? st.dockClass : (st.htmlClass || '');
    document.documentElement.setAttribute('style', st.dockStyle != null ? st.dockStyle : (st.htmlStyle || ''));
    if (st.scale) document.documentElement.style.zoom = (Math.max(50, Math.min(200, st.scale)) / 100);
  }

  function render(st){
    if (!st) return;
    applySkin(st);

    tgEl.classList.toggle('on', !!st.reqAuto);
    tgEl.setAttribute('aria-pressed', st.reqAuto ? 'true' : 'false');

    var html = st.feedHtml || '';
    cntEl.textContent = (st.msgCount || 0) + ' сообщ.';
    if (html !== lastHtml) {
      var nearBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60;
      if (nearBottom) stickBottom = true;
      lastHtml = html;
      feedEl.innerHTML = html || '<div class="dock-empty">Сообщений пока нет</div>';
      if (st.newOnTop) feedEl.scrollTop = 0;
      else if (stickBottom) feedEl.scrollTop = feedEl.scrollHeight;
    }

    var playing = st.np && st.np.playing;
    ppEl.innerHTML = playing
      ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>';
    npEl.innerHTML = st.np && st.np.title
      ? '<b>' + esc(st.np.title) + '</b>' + (st.np.artist ? ' · ' + esc(st.np.artist) : '')
      : 'ничего не играет';
    tmEl.textContent = fmt(st.np && st.np.pos);
  }

  feedEl.addEventListener('scroll', function(){
    stickBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60;
  });

  // Кнопки карточек работают как в приложении: передаём нажатие в приложение
  feedEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-rq]');
    if (!btn) return;
    e.preventDefault();
    var dataset = {};
    for (var k in btn.dataset) if (btn.dataset[k] != null) dataset[k] = btn.dataset[k];
    fetch('/widget/rq', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataset: dataset })
    }).catch(function(){});
  });

  function cmd(action){
    fetch('/widget/cmd/' + encodeURIComponent(action), { method: 'POST' }).catch(function(){});
  }
  document.querySelectorAll('[data-cmd]').forEach(function(b){
    b.addEventListener('click', function(){ cmd(b.dataset.cmd); });
  });

  tgEl.addEventListener('click', function(){
    var on = !tgEl.classList.contains('on');
    tgEl.classList.toggle('on', on);
    fetch('/widget/setting', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'reqAuto', value: on })
    }).catch(function(){});
  });

  var es = new EventSource('/widget/events');
  es.onmessage = function(e){ try { render(JSON.parse(e.data)); } catch (err) {} };
  fetch('/widget/state').then(function(r){ return r.json(); }).then(render).catch(function(){});
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плеер для стрима</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0E0F13;
    color: #ECEDF2;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-bottom: 1px solid #22242C;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: #9B87FF;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #0E0F13;
  }
  .title { font-weight: 700; font-size: 16px; }
  nav { display: flex; gap: 4px; background: #181A21; border-radius: 10px; padding: 3px; }
  nav button {
    height: 32px; padding: 0 14px; border: 0; border-radius: 8px;
    background: transparent; color: #C9CBD4; font-size: 13px; cursor: pointer;
  }
  nav button.active { background: #2A2D38; color: #ECEDF2; font-weight: 600; }
  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; text-align: center;
  }
  .muted { color: #8A8E9C; font-size: 14px; max-width: 420px; }
  .badge { font-size: 12px; color: #9B87FF; border: 1px solid #9B87FF; border-radius: 6px; padding: 2px 8px; }
</style>
</head>
<body>
  <header>
    <div class="logo">♪</div>
    <div class="title">Плеер для стрима</div>
    <nav>
      <button class="active">Поиск</button>
      <button>Браузер</button>
      <button>Настройки</button>
    </nav>
    <span class="badge" style="margin-left:auto">версия 0.1.0 · каркас</span>
  </header>
  <main>
    <div style="font-size:18px; font-weight:600">Каркас приложения работает ✓</div>
    <div class="muted">Окно открывается, значок живёт в трее, вкладки на месте. Дальше наполним экраны: поиск по сервисам, очередь, плеер, страница заказов.</div>
  </main>
</body>
</html>

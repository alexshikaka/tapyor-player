<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плеер для стрима</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0E0F13; color: #ECEDF2;
    font-family: 'Onest', 'Segoe UI', system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  input::placeholder { color: #7C8090; }

  /* Шапка */
  header { display: flex; align-items: center; gap: 24px; padding: 16px 150px 16px 24px; border-bottom: 1px solid #22242C; flex: 0 0 auto; -webkit-app-region: drag; }
  header button, header input, header nav, header .searchbar, header .chip, header .badge, header img, header .suggest { -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .logo { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; }
  .brand .name { font-weight: 700; font-size: 16px; }
  nav { display: flex; gap: 4px; background: #181A21; border-radius: 10px; padding: 3px; }
  nav button { height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #C9CBD4; font-size: 13px; font-weight: 500; cursor: pointer; }
  nav button.active { background: #2A2D38; color: #ECEDF2; font-weight: 600; }
  .searchwrap { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .searchbar { display: flex; align-items: center; gap: 10px; background: #181A21; border: 1px solid #2C2F3A; border-radius: 12px; padding: 0 14px; height: 46px; }
  .searchbar input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #ECEDF2; font-size: 15px; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid #2C2F3A; background: transparent; color: #C9CBD4; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .chip.active { background: #ECEDF2; color: #0E0F13; border-color: transparent; font-weight: 600; }
  .chip.soon { opacity: .5; cursor: default; }
  .dot { width: 8px; height: 8px; border-radius: 4px; }
  .badge { font-size: 12px; color: #9B87FF; border: 1px solid #9B87FF; border-radius: 6px; padding: 2px 8px; flex: 0 0 auto; }

  /* Основная часть */
  main { flex: 1; display: flex; min-height: 0; }
  .results-col { flex: 1 1 auto; min-width: 0; padding: 18px 24px; display: flex; flex-direction: column; gap: 8px; }
  .col-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 4px; }
  .col-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: #C9CBD4; }
  .col-head .hint { font-size: 13px; color: #8A8E9C; }
  .results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 12px; cursor: pointer; position: relative; }
  .row:hover { background: #171922; }
  .cover-wrap { position: relative; width: 44px; height: 44px; flex: 0 0 auto; border-radius: 8px; overflow: hidden; background: #222; }
  .cover { width: 44px; height: 44px; object-fit: cover; display: block; }
  .cover-ov { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .12s; }
  .row:hover .cover-ov, .row.playing .cover-ov { opacity: 1; }
  .row .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 13px; color: #9EA2B0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srcpill { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #C9CBD4; background: #1E2029; border-radius: 6px; padding: 4px 8px; }
  .time { flex: 0 0 48px; text-align: right; font-size: 13px; color: #9EA2B0; }
  .listen { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 19px; border: 1px solid #2C2F3A; background: transparent; color: #C9CBD4; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .listen:hover { background: #20222C; color: #ECEDF2; }
  .add { flex: 0 0 auto; height: 38px; padding: 0 14px; border-radius: 10px; border: 0; background: #9B87FF; color: #0E0F13; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }

  /* Правая колонка: очередь */
  .splitter { flex: 0 0 6px; margin: 0 -3px; cursor: col-resize; position: relative; z-index: 2; background: transparent; transition: background .12s; }
  .splitter:hover, .splitter.drag { background: rgba(155,135,255,.35); }
  body.resizing { cursor: col-resize; user-select: none; }
  .queue-col { flex: 0 0 auto; width: 380px; min-width: 280px; overflow: hidden; border-left: 1px solid #22242C; background: #12131A; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .queue-col .qhead { display: flex; justify-content: space-between; align-items: baseline; flex: 0 0 auto; }
  .queue-col .qhead h2 { margin: 0; font-size: 15px; font-weight: 600; color: #C9CBD4; }
  .queue-col .qhead span { font-size: 13px; color: #8A8E9C; }

  .nowcard { flex: 0 0 auto; border-radius: 14px; background: #1A1C25; border: 1px solid #2C2F3A; overflow: hidden; }
  .video { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #3A2F6B, #10121A 70%); }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; object-fit: contain; }
  .vmeta { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .nplabel { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9B87FF; }
  .vmeta .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vmeta .s { font-size: 13px; color: #9EA2B0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .qlist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .qrow { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 10px; }
  .qrow.playing { background: rgba(155,135,255,0.12); }
  .qrow .n { font-size: 13px; color: #7C8090; width: 16px; text-align: center; flex: 0 0 auto; }
  .qrow .qm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .qrow .qt { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .qrow .qs { font-size: 12px; color: #9EA2B0; display: flex; align-items: center; gap: 6px; }
  .qrow .x { width: 32px; height: 32px; border: 0; background: transparent; color: #7C8090; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .qrow .x:hover { background: #2A2D38; color: #ECEDF2; }
  .clearq { flex: 0 0 auto; height: 42px; border-radius: 10px; border: 1px dashed #3A3D4A; background: transparent; color: #9EA2B0; font-size: 13px; font-weight: 500; cursor: pointer; }
  .muted { color: #8A8E9C; font-size: 13px; text-align: center; padding: 16px 0; }

  /* Нижняя панель-плеер */
  footer { flex: 0 0 auto; display: flex; align-items: center; gap: 28px; padding: 14px 24px; border-top: 1px solid #22242C; background: #12131A; }
  .f-now { display: flex; align-items: center; gap: 12px; flex: 1 1 220px; min-width: 0; }
  .f-cover { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: #222; flex: 0 0 auto; }
  .f-now .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-now .s { font-size: 12px; color: #9EA2B0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-center { flex: 2 1 420px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .controls { display: flex; align-items: center; gap: 14px; }
  .cbtn { display: flex; align-items: center; justify-content: center; border: 0; cursor: pointer; border-radius: 50%; background: transparent; color: #C9CBD4; padding: 0; }
  .cbtn.side { width: 40px; height: 40px; }
  .cbtn.side:hover { background: #20222C; color: #ECEDF2; }
  .cbtn.play { width: 48px; height: 48px; background: #ECEDF2; color: #0E0F13; }
  .cbtn.play:hover { background: #fff; }
  .progress { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 10px; }
  .tm { font-size: 12px; color: #9EA2B0; width: 34px; flex: 0 0 auto; }
  .tm.r { text-align: right; }
  .seek { flex: 1; height: 8px; border-radius: 4px; background: #2C2F3A; position: relative; cursor: pointer; }
  .seek-fill { position: absolute; left: 0; top: 0; height: 8px; border-radius: 4px; background: #9B87FF; width: 0%; }
  .seek-knob { position: absolute; top: 50%; left: 0%; width: 16px; height: 16px; border-radius: 8px; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .f-right { flex: 1 1 200px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: #9EA2B0; }
  .f-right input { width: 110px; accent-color: #9B87FF; cursor: pointer; }

  /* Аккаунт Яндекса */
  .acct { flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2C2F3A; background: #181A21; color: #ECEDF2; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .acct:hover { background: #20222C; }

  /* Подсказки при наборе */
  .searchwrap { position: relative; }
  .suggest { position: absolute; top: 50px; left: 0; right: 0; z-index: 50; background: #181A21; border: 1px solid #2C2F3A; border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.55); display: none; -webkit-app-region: no-drag; }
  .sg-label { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8A8E9C; padding: 6px 10px 4px; }
  .sg-item { padding: 9px 12px; border-radius: 8px; font-size: 14px; color: #ECEDF2; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-item:hover, .sg-item.active { background: #2A2D38; }

  /* Фильтр по источнику */
  .results.f-ym .row[data-src="yt"], .results.f-yt .row[data-src="ym"] { display: none; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="assets/icon.png" alt="">
      <div class="name">Заказы</div>
      <nav>
        <button class="active">Поиск</button>
        <button>Браузер</button>
        <button>Настройки</button>
      </nav>
    </div>
    <div class="searchwrap">
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9EA2B0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="search" type="text" placeholder="Название, исполнитель или ссылка">
        <span class="mono" style="font-size:12px;color:#7C8090;border:1px solid #2C2F3A;border-radius:6px;padding:3px 7px">Enter</span>
      </div>
      <div class="suggest" id="suggest"></div>
      <div class="chips" id="chips">
        <button class="chip active" data-f="all">Везде</button>
        <button class="chip" data-f="ym"><span class="dot" style="background:#FFD43B"></span>Яндекс</button>
        <button class="chip" data-f="yt"><span class="dot" style="background:#FF5A52"></span>YouTube</button>
        <button class="chip soon" disabled><span class="dot" style="background:#3BA8F0"></span>Telegram · скоро</button>
        <button class="chip soon" disabled><span class="dot" style="background:#FF8A3D"></span>SoundCloud · скоро</button>
      </div>
    </div>
    <button class="acct" id="acct" title="Аккаунт Яндекс Музыки"><span class="dot" style="background:#FFD43B"></span>Войти в Яндекс</button>
    <span class="badge" id="ver">версия…</span>
  </header>

  <main>
    <section class="results-col" aria-label="Результаты поиска">
      <div class="col-head">
        <h2>Результаты</h2>
        <span class="hint" id="hint">Введи название и нажми Enter</span>
      </div>
      <div class="results" id="results">
        <div class="muted">Здесь появятся найденные треки.</div>
      </div>
    </section>

    <div class="splitter" id="splitter" title="Потяни, чтобы изменить ширину"></div>

    <aside class="queue-col" aria-label="Очередь">
      <div class="qhead">
        <h2>Очередь</h2>
        <span id="qcount">0 треков</span>
      </div>

      <div class="nowcard">
        <div class="video"><video id="player" playsinline></video><audio id="aud"></audio></div>
        <div class="vmeta">
          <div class="nplabel">Сейчас играет</div>
          <div class="t" id="card-title">Ничего не играет</div>
          <div class="s" id="card-sub">Найди трек и запусти</div>
        </div>
      </div>

      <div class="qlist" id="queue">
        <div class="muted">Пусто. Добавляй треки из поиска.</div>
      </div>

      <button class="clearq" id="clearq">Очистить очередь</button>
    </aside>
  </main>

  <footer>
    <div class="f-now">
      <img class="f-cover" id="f-cover" alt="" style="display:none">
      <div style="min-width:0">
        <div class="t" id="f-title">Ничего не играет</div>
        <div class="s" id="f-sub">Найди трек и нажми play</div>
      </div>
    </div>
    <div class="f-center">
      <div class="controls">
        <button class="cbtn side" id="prev" title="Предыдущий" aria-label="Предыдущий"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM20 6v12l-9-6z"></path></svg></button>
        <button class="cbtn play" id="playpause" title="Пауза / играть" aria-label="Пауза / играть"></button>
        <button class="cbtn side" id="next" title="Следующий" aria-label="Следующий"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15 6h2v12h-2zM4 6v12l9-6z"></path></svg></button>
      </div>
      <div class="progress">
        <span class="tm mono" id="tcur">0:00</span>
        <div class="seek" id="seek" title="Перемотка"><div class="seek-fill" id="seekFill"></div><div class="seek-knob" id="seekKnob"></div></div>
        <span class="tm mono r" id="tdur">0:00</span>
      </div>
    </div>
    <div class="f-right">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 010 7"></path></svg>
      <input id="vol" type="range" min="0" max="100" value="100" aria-label="Громкость">
    </div>
  </footer>

<script>
  if (window.app && window.app.getVersion) {
    window.app.getVersion().then(function (v) { document.getElementById('ver').textContent = 'версия ' + v; });
  }

  var queue = [];     // {id,title,author,duration,thumb}
  var current = -1;
  var playingId = null;
  var video = document.getElementById('player');

  var PLAY_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>';
  var PAUSE_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>';
  function setPlayIcon(sym){ document.getElementById('playpause').innerHTML = (sym === '⏸') ? PAUSE_SVG : PLAY_SVG; }
  setPlayIcon('▶');

  // Два режима: 'single' — всё в одном <video>; 'split' — звук в <audio> (главный), видео без звука подстраивается
  var aud = document.getElementById('aud');
  var mode = 'single';
  // + режим 'audio' — только звук (Яндекс), в окне видео обложка
  function master(){ return (mode === 'split' || mode === 'audio') ? aud : video; }

  // Источник трека: Яндекс или YouTube
  function srcOf(v){ return v && v.src === 'ym' ? 'ym' : 'yt'; }
  function srcName(v){ return srcOf(v) === 'ym' ? 'Яндекс' : 'YouTube'; }
  function srcColor(v){ return srcOf(v) === 'ym' ? '#FFD43B' : '#FF5A52'; }
  function srcDot(v){ return '<span class="dot" style="background:' + srcColor(v) + '"></span>'; }

  [video, aud].forEach(function (el) {
    el.addEventListener('ended', function(){ if (el === master()) next(); });
    el.addEventListener('play', function(){
      if (el !== master()) return;
      setPlayIcon('⏸');
      if (mode === 'split') video.play().catch(function(){});
    });
    el.addEventListener('pause', function(){
      if (el !== master()) return;
      setPlayIcon('▶');
      if (mode === 'split') video.pause();
    });
    el.addEventListener('timeupdate', function(){
      if (el !== master()) return;
      var d = el.duration || 0, c = el.currentTime || 0;
      document.getElementById('tcur').textContent = fmt(c);
      document.getElementById('tdur').textContent = fmt(d);
      if (!dragging && d > 0) setBar(c / d);
      if (mode === 'split') {
        // плавная подгонка видео под звук: перемотка только при сильном расхождении
        var drift = (video.currentTime || 0) - c;
        if (Math.abs(drift) > 1) { try { video.currentTime = c; } catch (e) {} video.playbackRate = 1; }
        else if (Math.abs(drift) > 0.15) { video.playbackRate = drift > 0 ? 0.95 : 1.05; }
        else if (video.playbackRate !== 1) { video.playbackRate = 1; }
      }
    });
    el.addEventListener('error', function(){
      if (el === master() && el.getAttribute('src')) setSub('⚠ не удалось воспроизвести поток');
    });
  });

  var search = document.getElementById('search'), results = document.getElementById('results');
  // --- Подсказки при наборе: сначала Яндекс, если пусто — YouTube ---
  var sgEl = document.getElementById('suggest'), sgItems = [], sgIdx = -1, sgTimer = null, sgToken = 0;
  function hideSuggest(){ sgEl.style.display = 'none'; sgItems = []; sgIdx = -1; }
  function highlightSg(){ var els = sgEl.querySelectorAll('.sg-item'); for (var k = 0; k < els.length; k++) els[k].classList.toggle('active', k === sgIdx); }
  function pickSuggest(i){ var s = sgItems[i]; if (s == null) return; search.value = s; hideSuggest(); doSearch(); }
  async function loadSuggest(t){
    var tok = ++sgToken;
    if (!window.app || !window.app.suggest) return;
    var r = await window.app.suggest(t);
    if (tok !== sgToken || search.value.trim() !== t || document.activeElement !== search) return;
    if (!r || !r.items || !r.items.length) { hideSuggest(); return; }
    sgItems = r.items; sgIdx = -1;
    var isYm = r.source === 'ym';
    sgEl.innerHTML = '<div class="sg-label"><span class="dot" style="background:' + (isYm ? '#FFD43B' : '#FF5A52') + '"></span>' + (isYm ? 'Подсказки Яндекс Музыки' : 'Подсказки YouTube') + '</div>' +
      sgItems.map(function (s, i){ return '<div class="sg-item" data-i="' + i + '">' + esc(s) + '</div>'; }).join('');
    sgEl.style.display = 'block';
  }
  search.addEventListener('input', function(){
    clearTimeout(sgTimer);
    var t = search.value.trim();
    if (t.length < 2) { sgToken++; hideSuggest(); return; }
    sgTimer = setTimeout(function(){ loadSuggest(t); }, 220);
  });
  sgEl.addEventListener('mousedown', function(e){
    var it = e.target.closest('.sg-item'); if (!it) return;
    e.preventDefault(); pickSuggest(parseInt(it.dataset.i, 10));
  });
  search.addEventListener('blur', function(){ setTimeout(hideSuggest, 120); });
  search.addEventListener('keydown', function (e){
    var open = sgEl.style.display === 'block' && sgItems.length;
    if (e.key === 'ArrowDown' && open) { e.preventDefault(); sgIdx = Math.min(sgItems.length - 1, sgIdx + 1); highlightSg(); }
    else if (e.key === 'ArrowUp' && open) { e.preventDefault(); sgIdx = Math.max(-1, sgIdx - 1); highlightSg(); }
    else if (e.key === 'Escape') { hideSuggest(); }
    else if (e.key === 'Enter') { if (open && sgIdx >= 0) pickSuggest(sgIdx); else { hideSuggest(); doSearch(); } }
  });

  // Состояние поиска для подгрузки при прокрутке
  var curQuery = '', shownIds = new Set(), loadingMore = false, hasMore = false, searchToken = 0;

  async function doSearch() {
    var q = search.value.trim(); if (!q) return;
    var token = ++searchToken;
    curQuery = q; shownIds = new Set(); hasMore = false; loadingMore = false;
    document.getElementById('hint').textContent = 'Ищу…';
    results.innerHTML = '<div class="muted">Ищу…</div>';
    results.scrollTop = 0;
    sgToken++; hideSuggest();
    // Ищем параллельно: Яндекс (приоритет) + YouTube
    var ymP = (window.app.ymSearch ? window.app.ymSearch(q) : Promise.resolve([])).catch(function(){ return []; });
    var ytP = window.app.ytSearch(q).catch(function(e){ return { error: String(e) }; });
    var both = await Promise.all([ymP, ytP]);
    if (token !== searchToken) return; // уже ищем другое
    var ymRes = Array.isArray(both[0]) ? both[0] : [];
    var ytRes = Array.isArray(both[1]) ? both[1].map(function (v){ v.src = 'yt'; return v; }) : [];
    if (!ymRes.length && !ytRes.length) {
      var err = both[1] && both[1].error;
      results.innerHTML = '<div class="muted">' + (err ? 'Ошибка поиска: ' + esc(err) : 'Ничего не нашлось.') + '</div>';
      document.getElementById('hint').textContent = ''; return;
    }
    document.getElementById('hint').textContent = ymRes.length ? 'Сначала Яндекс Музыка, ниже YouTube' : 'Результаты YouTube';
    results.innerHTML = '';
    appendResults(ymRes.concat(ytRes));
    hasMore = true;
    maybeLoadMore();
  }

  function appendResults(list) {
    var added = 0;
    list.forEach(function (v) {
      if (!v || !v.id || shownIds.has(v.id)) return;
      shownIds.add(v.id); added++;
      results.appendChild(makeRow(v));
    });
    return added;
  }

  // Подгрузка следующей порции, когда долистали почти до конца
  async function maybeLoadMore() {
    if (!hasMore || loadingMore || !curQuery) return;
    if (curFilter === 'ym') return; // дальше подгружается YouTube — при фильтре «Яндекс» не нужно
    if (results.scrollTop + results.clientHeight < results.scrollHeight - 300) return;
    if (!window.app || !window.app.ytSearchMore) { hasMore = false; return; }
    loadingMore = true;
    var token = searchToken;
    var loader = document.createElement('div'); loader.className = 'muted'; loader.textContent = 'Загружаю ещё…';
    results.appendChild(loader);
    var more = await window.app.ytSearchMore(curQuery, shownIds.size + 20);
    loader.remove();
    loadingMore = false;
    if (token !== searchToken) return;
    if (!more || more.error) { hasMore = false; return; }
    if (appendResults(more) === 0) { hasMore = false; return; }
    maybeLoadMore();
  }
  results.addEventListener('scroll', maybeLoadMore);

  function makeRow(v) {
      var row = document.createElement('div'); row.className = 'row' + (v.id === playingId ? ' playing' : '');
      row.dataset.id = v.id;
      row.dataset.src = srcOf(v);
      row.innerHTML =
        '<div class="cover-wrap"><img class="cover" src="' + esc(v.thumb) + '" alt="">' +
        '<span class="cover-ov"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"></path></svg></span></div>' +
        '<div class="meta"><div class="t">' + esc(v.title) + '</div><div class="s">' + esc(v.author) + '</div></div>' +
        '<span class="srcpill">' + srcDot(v) + srcName(v) + '</span>' +
        '<span class="time mono">' + esc(v.duration) + '</span>';
      var add = document.createElement('button'); add.className = 'add';
      add.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0E0F13" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>В очередь';
      add.onclick = function(e){ e.stopPropagation(); addToQueue(v); };
      row.appendChild(add);
      row.onclick = function(){ playNow(v); };
      return row;
  }

  function markPlayingRows(){
    var rows = document.querySelectorAll('.results .row');
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('playing', rows[i].dataset.id === playingId);
  }

  function addToQueue(v){ queue.push(v); renderQueue(); if (current === -1) playIndex(0); else prefetchNext(); }
  // Заранее достать поток следующего трека, чтобы переход был без паузы
  function prefetchNext(){
    var n = queue[current + 1];
    if (!n || !window.app) return;
    var f = srcOf(n) === 'ym' ? window.app.ymStream : window.app.ytStream;
    if (f) f(n.id).catch(function(){});
  }
  function playNow(v){ queue.splice(current + 1, 0, v); playIndex(current + 1); }

  function setSub(txt){ document.getElementById('card-sub').textContent = txt; document.getElementById('f-sub').textContent = txt; }

  async function playIndex(i) {
    if (i < 0 || i >= queue.length) return;
    current = i; var v = queue[i];
    playingId = v.id; markPlayingRows();
    document.getElementById('card-title').textContent = v.title;
    document.getElementById('f-title').textContent = v.title;
    var fsub = document.getElementById('f-sub');
    fsub.innerHTML = srcDot(v) + srcName(v) + ' · ' + esc(v.author);
    var fc = document.getElementById('f-cover');
    if (v.thumb) { fc.src = v.thumb; fc.style.display = ''; } else { fc.style.display = 'none'; }
    renderQueue();
    setSub('Загружаю…');
    var r = srcOf(v) === 'ym' ? await window.app.ymStream(v.id) : await window.app.ytStream(v.id);
    if (i !== current) return; // переключили, пока грузилось
    if (!r || r.error) { setSub('⚠ ' + ((r && r.error) ? r.error : 'поток не получен')); return; }
    var vol = (parseInt(document.getElementById('vol').value, 10) || 100) / 100;
    video.removeAttribute('poster');
    if (r.audioUrl && !r.videoUrl) {
      // только звук (Яндекс): в окне видео — обложка
      mode = 'audio';
      video.pause(); video.removeAttribute('src'); video.load();
      if (v.cover || v.thumb) video.setAttribute('poster', v.cover || v.thumb);
      aud.src = r.audioUrl; aud.volume = vol;
      aud.play().catch(function(){});
    } else if (r.audioUrl) {
      mode = 'split';
      video.muted = true; video.src = r.videoUrl;
      aud.src = r.audioUrl; aud.volume = vol;
      aud.play().catch(function(){});
    } else {
      mode = 'single';
      aud.pause(); aud.removeAttribute('src'); aud.load();
      video.muted = false; video.src = r.url; video.volume = vol;
      video.play().catch(function(){});
    }
    prefetchNext();
    document.getElementById('card-sub').textContent = v.author + (r.preview ? ' · превью 30 с (нужен Плюс)' : '');
  }
  function next(){ if (current + 1 < queue.length) playIndex(current + 1); }
  function prev(){ if (current - 1 >= 0) playIndex(current - 1); }
  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;
  document.getElementById('playpause').onclick = function(){
    var m = master();
    if (!m.getAttribute('src')) return;
    if (m.paused) m.play().catch(function(){}); else m.pause();
  };
  function stopVideo(){
    [video, aud].forEach(function (el) { el.pause(); el.removeAttribute('src'); el.load(); });
    video.removeAttribute('poster');
    mode = 'single';
  }
  document.getElementById('clearq').onclick = function(){ queue = []; current = -1; playingId = null; markPlayingRows(); stopVideo(); document.getElementById('card-title').textContent='Ничего не играет'; document.getElementById('card-sub').textContent='Найди трек и запусти'; document.getElementById('f-title').textContent='Ничего не играет'; document.getElementById('f-sub').textContent='Найди трек и нажми play'; renderQueue(); };

  function removeAt(i) {
    queue.splice(i, 1);
    if (i < current) current--;
    else if (i === current) { if (current >= queue.length) current = queue.length - 1; if (current >= 0) playIndex(current); else { current = -1; playingId = null; markPlayingRows(); stopVideo(); } }
    renderQueue();
  }

  function renderQueue() {
    var box = document.getElementById('queue');
    document.getElementById('qcount').textContent = queue.length + ' ' + plural(queue.length);
    if (!queue.length) { box.innerHTML = '<div class="muted">Пусто. Добавляй треки из поиска.</div>'; return; }
    box.innerHTML = '';
    queue.forEach(function (v, i) {
      var r = document.createElement('div'); r.className = 'qrow' + (i === current ? ' playing' : '');
      r.innerHTML =
        '<span class="n">' + (i === current ? '▶' : (i + 1)) + '</span>' +
        '<div class="qm"><div class="qt">' + esc(v.title) + '</div>' +
        '<div class="qs">' + srcDot(v) + srcName(v) + ' · ' + esc(v.author) + '</div></div>';
      var x = document.createElement('button'); x.className = 'x'; x.title = 'Убрать';
      x.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
      x.onclick = function(){ removeAt(i); };
      r.appendChild(x);
      r.querySelector('.qt').onclick = function(){ playIndex(i); };
      box.appendChild(r);
    });
  }

  // Полоса прогресса
  var seekEl = document.getElementById('seek'), fillEl = document.getElementById('seekFill'), knobEl = document.getElementById('seekKnob'), dragging = false;
  function fmt(s){ s = Math.max(0, Math.floor(s||0)); var m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }
  function setBar(frac){ frac = Math.max(0, Math.min(1, frac)); var p = (frac*100) + '%'; fillEl.style.width = p; knobEl.style.left = p; }
  function fracAt(x){ var r = seekEl.getBoundingClientRect(); return (x - r.left) / r.width; }
  function doSeek(x){
    var m = master(), d = m.duration || 0; if (d <= 0) return;
    var t = Math.max(0, Math.min(1, fracAt(x))) * d;
    m.currentTime = t;
    if (mode === 'split') { try { video.currentTime = t; } catch (e) {} }
  }
  seekEl.addEventListener('mousedown', function(e){ dragging = true; setBar(fracAt(e.clientX)); });
  document.addEventListener('mousemove', function(e){ if (dragging) setBar(fracAt(e.clientX)); });
  document.addEventListener('mouseup', function(e){ if (dragging) { dragging = false; doSeek(e.clientX); } });

  var volEl = document.getElementById('vol');
  volEl.addEventListener('input', function(){ var v = (parseInt(volEl.value,10)||0)/100; aud.volume = v; video.volume = v; });

  // Перетаскиваемая граница между поиском и панелью «видео + очередь»
  var qcol = document.querySelector('.queue-col'), splitter = document.getElementById('splitter'), splitDrag = false;
  function setQW(w){
    var max = Math.max(300, window.innerWidth - 420);
    w = Math.max(280, Math.min(max, w));
    qcol.style.width = w + 'px';
    return w;
  }
  if (window.app && window.app.getSetting) window.app.getSetting('queueWidth').then(function(w){ if (w) setQW(w); });
  splitter.addEventListener('mousedown', function(e){ splitDrag = true; splitter.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault(); });
  document.addEventListener('mousemove', function(e){ if (splitDrag) setQW(window.innerWidth - e.clientX); });
  document.addEventListener('mouseup', function(){
    if (!splitDrag) return;
    splitDrag = false; splitter.classList.remove('drag'); document.body.classList.remove('resizing');
    if (window.app && window.app.setSetting) window.app.setSetting('queueWidth', parseInt(qcol.style.width, 10));
  });
  window.addEventListener('resize', function(){ if (qcol.style.width) setQW(parseInt(qcol.style.width, 10)); });

  // Фильтр по источнику: Везде / Яндекс / YouTube
  var curFilter = 'all';
  document.getElementById('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b || b.disabled || !b.dataset.f) return;
    curFilter = b.dataset.f;
    var all = this.querySelectorAll('.chip[data-f]');
    for (var k = 0; k < all.length; k++) all[k].classList.toggle('active', all[k] === b);
    results.classList.toggle('f-ym', curFilter === 'ym');
    results.classList.toggle('f-yt', curFilter === 'yt');
    maybeLoadMore();
  });

  // Аккаунт Яндекс Музыки
  var acctBtn = document.getElementById('acct');
  var YM_DOT = '<span class="dot" style="background:#FFD43B"></span>';
  async function refreshAcct(){
    if (!window.app || !window.app.ymStatus) return;
    var s = await window.app.ymStatus();
    if (s && s.loggedIn) {
      acctBtn.innerHTML = YM_DOT + esc(s.name || s.login || 'Яндекс') + (s.offline ? '' : (s.hasPlus ? ' · Плюс' : ' · без Плюса'));
      acctBtn.dataset.in = '1';
      acctBtn.title = 'Нажми, чтобы выйти из аккаунта';
    } else {
      acctBtn.innerHTML = YM_DOT + 'Войти в Яндекс';
      acctBtn.dataset.in = '';
      acctBtn.title = (s && s.error) ? s.error : 'Войти в Яндекс Музыку';
    }
  }
  acctBtn.addEventListener('click', async function(){
    if (acctBtn.dataset.in) {
      if (confirm('Выйти из аккаунта Яндекс Музыки?')) { await window.app.ymLogout(); refreshAcct(); }
      return;
    }
    acctBtn.textContent = 'Открываю вход…';
    var r = await window.app.ymLogin();
    if (r && r.error && r.error !== 'вход отменён') alert('Вход в Яндекс: ' + r.error);
    refreshAcct();
  });
  refreshAcct();

  function plural(n){ n=n%100; if(n>=11&&n<=14)return'треков'; n=n%10; if(n===1)return'трек'; if(n>=2&&n<=4)return'трека'; return'треков'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
</script>
</body>
</html>

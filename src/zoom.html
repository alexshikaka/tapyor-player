<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Масштаб</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font: 500 12px "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--tx2, #C9CBD4);
    background: var(--bg1, #15161C);
    border: 1px solid var(--ln, #2C2F3A);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 18px 44px rgba(0,0,0,.45);
    overflow: hidden;
    user-select: none;
  }
  .t { font-size: 12px; color: var(--tx2, #9EA2B0); }
  .row { display: flex; align-items: center; gap: 10px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 2px 0;
    background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: var(--bg3, #2A2D38); box-shadow: inset 0 0 0 1px var(--ln, #23252F);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%;
    background: var(--ac, #9B87FF); border: 2px solid var(--bg1, #15161C); box-shadow: 0 1px 4px rgba(0,0,0,.45);
  }
  input[type=range]:focus { outline: none; }
  input[type=range]:focus::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(155,135,255,.25); }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .pct { font-weight: 700; color: var(--tx, #ECEDF2); font-size: 13px; }
  button {
    height: 24px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--ln, #2C2F3A);
    background: #1E2029; color: var(--tx2, #C9CBD4); font: inherit; cursor: pointer;
  }
  button:hover { background: var(--bg2, #2A2D38); color: var(--tx, #ECEDF2); }
</style>
</head>
<body>
  <div class="t">Масштаб интерфейса</div>
  <input id="r" type="range" min="60" max="140" step="5" value="100" aria-label="Масштаб интерфейса">
  <div class="foot">
    <span class="pct" id="v">100%</span>
    <button id="reset">Сбросить</button>
  </div>
<script>
  const r = document.getElementById('r'), v = document.getElementById('v');
  let z = 1;
  function paint(value) {
    z = Math.min(1.4, Math.max(0.6, Number(value) || 1));
    const pct = Math.round(z * 100);
    r.value = pct; v.textContent = pct + '%';
  }
  async function apply(value) {
    paint(value);
    const actual = await window.zoomApi.set(z);
    if (actual) paint(actual);
  }
  r.addEventListener('input', () => apply(r.value / 100));
  document.getElementById('reset').addEventListener('click', () => apply(1));
  window.zoomApi.onChange((val) => paint(val));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.zoomApi.close(); });
  window.addEventListener('blur', () => window.zoomApi.close());
  window.zoomApi.get().then((val) => { if (val) paint(val); });
  if (window.zoomApi.onTheme) window.zoomApi.onTheme((t) => {
    if (!t) return;
    const root = document.documentElement.style;
    if (t.bg) root.setProperty('--bg1', t.bg);
    if (t.bg2) root.setProperty('--bg3', t.bg2);
    if (t.line) root.setProperty('--ln', t.line);
    if (t.tx) { root.setProperty('--tx', t.tx); root.setProperty('--tx2', t.tx2 || t.tx); }
    if (t.ac) root.setProperty('--ac', t.ac);
  });
</script>
</body>
</html>

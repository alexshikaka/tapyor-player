<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Масштаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg0, #0E0F13); }
  body {
    font: 500 12px var(--ui-font, 'Segoe UI', Tahoma, Arial, sans-serif);
    color: var(--tx2, #C9CBD4);
    overflow: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  /* Поле — по тем же правилам, что app-shell: нижние углы из токена оболочки */
  .main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 10px 12px 10px;
    background: var(--bg1, #15161C);
    border-radius: 0 0 var(--r-panel, 0px) var(--r-panel, 0px);
  }
  .lbl { font-size: 11px; color: var(--tx3, #9EA2B0); }
  .val { font-size: 24px; font-weight: 700; line-height: 1.05; color: var(--tx, #ECEDF2); }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 18px;
    margin: 2px 0 0; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: var(--r-ctl, 3px);
    background: var(--bg3, #1E2029); box-shadow: inset 0 0 0 1px var(--ln, #2C2F3A);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5px;
    border-radius: var(--r-ctl, 50%);
    background: var(--ac, #9B87FF); border: 2px solid var(--bg1, #15161C);
    box-shadow: 0 1px 4px rgba(0,0,0,.45);
  }
  input[type=range]:focus { outline: none; }
  /* Пиксельные шрифты шире: в маленьком окне уменьшаем кегль подписей и кнопок */
  body.pixel .lbl { font-size: 10px; }
  body.pixel .val { font-size: 20px; }
  body.pixel .foot button { font-size: 8px; letter-spacing: 0; }
  input[type=range]:focus::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(155,135,255,.25); }
  /* Подвал — нижний слой на всю ширину, кнопки с шагом 10% */
  .foot {
    flex: 0 0 auto;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 10px 8px;
    background: var(--bg0, #0E0F13);
  }
  .foot button {
    flex: 1 1 0;
    min-width: 0;
    height: 26px;
    padding: 0;
    border: 1px solid var(--ln, #2C2F3A);
    border-radius: var(--r-ctl, 0px);
    background: var(--bg3, #1E2029);
    color: var(--tx2, #C9CBD4);
    font: 600 10px var(--ui-font, 'Segoe UI', Tahoma, Arial, sans-serif);
    cursor: pointer;
    transition: background-color .12s ease, color .12s ease;
  }
  .foot button:hover { background: var(--bg4, #2A2D38); color: var(--tx, #ECEDF2); }
  .foot button.on {
    background: var(--ac, #9B87FF);
    border-color: var(--ac, #9B87FF);
    color: var(--prit, #0E0F13);
  }
</style>
</head>
<body>
  <div class="main">
    <div class="lbl">Масштаб интерфейса</div>
    <div class="val" id="v">100%</div>
    <input id="r" type="range" min="60" max="140" step="5" value="100" aria-label="Масштаб интерфейса">
  </div>
  <div class="foot" id="foot"></div>
<script>
  const v = document.getElementById('v'), r = document.getElementById('r'), foot = document.getElementById('foot');
  let z = 1;
  const steps = [];
  for (let s = 60; s <= 140; s += 10) steps.push(s);

  function paint(value) {
    z = Math.min(1.4, Math.max(0.6, Number(value) || 1));
    const pct = Math.round(z * 100);
    v.textContent = pct + '%';
    r.value = pct;
    Array.prototype.forEach.call(foot.children, (b) => b.classList.toggle('on', +b.dataset.pct === pct));
  }
  async function apply(value) {
    paint(value);
    const actual = await window.zoomApi.set(z);
    if (actual) paint(actual);
  }
  steps.forEach((pct) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.pct = String(pct);
    b.textContent = pct;
    b.title = pct + '%';
    b.addEventListener('click', () => apply(pct / 100));
    foot.appendChild(b);
  });
  r.addEventListener('input', () => apply(r.value / 100));
  window.zoomApi.onChange((val) => paint(val));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.zoomApi.close(); });
  window.addEventListener('blur', () => window.zoomApi.close());
  window.zoomApi.get().then((val) => { if (val) paint(val); });
  if (window.zoomApi.onTheme) window.zoomApi.onTheme((t) => {
    if (!t) return;
    const root = document.documentElement.style;
    if (t.bg) root.setProperty('--bg1', t.bg);
    if (t.bg0) root.setProperty('--bg0', t.bg0);
    if (t.bg2) root.setProperty('--bg3', t.bg2);
    if (t.bg4) root.setProperty('--bg4', t.bg4);
    if (t.line) root.setProperty('--ln', t.line);
    if (t.tx) { root.setProperty('--tx', t.tx); root.setProperty('--tx2', t.tx2 || t.tx); }
    if (t.ac) root.setProperty('--ac', t.ac);
    if (t.prit) root.setProperty('--prit', t.prit);
    if (t.font) root.setProperty('--ui-font', t.font);
    document.body.classList.toggle('pixel', !!t.pixel);
    if (t.radiusPanel) root.setProperty('--r-panel', t.radiusPanel);
    if (t.radiusCtl) root.setProperty('--r-ctl', t.radiusCtl);
  });
</script>
</body>
</html>

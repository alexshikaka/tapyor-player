<!doctype html><html><head><meta charset="utf-8"></head><body>
<header><h1>Группа крови</h1><button aria-label="Воспроизвести трек" id="hp">▶</button><button aria-label="Нравится">♥</button></header>
<footer class="PlayerBar_root"><button aria-label="Воспроизведение" id="pb">▶</button><button aria-label="Следующий">»</button></footer>
<script>
var a = new Audio();
navigator.mediaSession.metadata = null;
document.getElementById('hp').onclick = function(){ a.src = '/loud.wav'; navigator.mediaSession.metadata = new MediaMetadata({ title: 'Группа крови', artist: 'Кино' }); a.play(); };
document.getElementById('pb').onclick = function(){ a.src = '/quiet.wav'; navigator.mediaSession.metadata = new MediaMetadata({ title: 'Другое', artist: 'X' }); a.play(); };
// сайт пытается сам играть при загрузке
setTimeout(function(){ a.src = '/quiet.wav'; a.play(); }, 100);
a.addEventListener('ended', function(){ setTimeout(function(){ a.src='/quiet.wav'; a.play(); }, 50); }); // авто-следующий
</script></body></html>
